# Called by the app's /youtube/callback PAGE, not by Google — which is exactly
# why it requires a JWT. Google's redirect lands on a page inside DragonCandy,
# and that page forwards the code here with the user's own session; verifyState
# then requires the signed state to name that same user. Without an
# authenticated caller the flow is open to OAuth account-linking CSRF (start a
# connect, send the authorize URL to a victim, receive their tokens under your
# own account), which a signed state alone does not close.
[functions.youtube-oauth-callback]
verify_jwt = true

# Stated explicitly rather than inherited, so it reads as a decision: this one
# IS called by fetch from the app and must have an authenticated caller — the
# user_id it signs into the state comes from that JWT and from nothing else.
[functions.youtube-oauth-start]
verify_jwt = true

# Called by fetch from the app; the row it deletes is scoped by the caller's own
# user id, so an authenticated caller is required. Stated explicitly for the
# same reason as youtube-oauth-start.
[functions.youtube-disconnect]
verify_jwt = true

# Read-only analytics for the signed-in user; the connection it reads is scoped
# by the caller's own user id, so an authenticated caller is required.
[functions.youtube-analytics]
verify_jwt = true

# ---------------------------------------------------------------------------
# Instagram read-only insights connector.
#
# FOUR AUTHENTICATED + THREE ANONYMOUS, and the split is the security design.
# Stated explicitly rather than inherited, because a comment in a function file
# saying "deploy this with --no-verify-jwt" is not a configuration — it is a
# hope. (Caught by the Codex second review, which was right on the substance and
# right that this file is where it belongs.)
# ---------------------------------------------------------------------------

# Called by fetch from the app. The user_id it signs into the OAuth state comes
# from this JWT and from nothing else.
[functions.instagram-oauth-start]
verify_jwt = true

# Called by the app's /instagram/callback PAGE, not by Meta — which is exactly
# why it requires a JWT. Meta's redirect lands on a page inside DragonCandy, and
# that page forwards the code here with the user's own session; verifyState then
# requires the signed state to name that same user. Without an authenticated
# caller the flow is open to OAuth account-linking CSRF (start a connect, send
# the authorize URL to a victim, receive their tokens under your own account),
# which a signed state alone does not close.
[functions.instagram-oauth-callback]
verify_jwt = true

# Called by fetch from the app; the row it deletes is scoped by the caller's own
# user id, so an authenticated caller is required.
[functions.instagram-disconnect]
verify_jwt = true

# Read-only insights for the signed-in user; the connection it reads is scoped
# by the caller's own user id.
[functions.instagram-insights]
verify_jwt = true

# ANONYMOUS BY NECESSITY. Meta POSTs here when a user removes DragonCandy from
# their Instagram settings — with no session and no bearer we issued, so the
# gateway would reject a real callback before the function ever ran. The
# signed_request HMAC is the entire authorization; see
# _shared/instagram-signed-request.ts. A missing INSTAGRAM_APP_SECRET fails
# closed (503) rather than open.
[functions.instagram-deauthorize]
verify_jwt = false

# Anonymous for the same reason and with the same signature check: Meta's data
# deletion request callback, required before App Review.
[functions.instagram-data-deletion]
verify_jwt = false

# Anonymous because pg_cron calls it with the Vault-held ingest bearer, not a
# user JWT — the same shape as auto-approve-content and
# reconcile-pending-flushes. It authorizes via _shared/ingest-auth.ts.
[functions.instagram-refresh-sweep]
verify_jwt = false

# ---------------------------------------------------------------------------
# Instagram native publishing (the first direct-API WRITE in this project)
#
# instagram-publish-enqueue REQUIRES a JWT and there is no version of it that
# does not. It is the only way a row reaches `publish_jobs`, and the enqueue RPC
# identifies the caller from `auth.uid()` — so the JWT is not a gate in front of
# the authorization, it IS the authorization. Turning this off would not open a
# hole so much as remove the identity the whole feature is built on.
[functions.instagram-publish-enqueue]
verify_jwt = true

# Anonymous for the same reason as instagram-refresh-sweep: pg_cron calls it
# with the Vault-held ingest bearer, not a user JWT, and it authorizes via
# _shared/ingest-auth.ts (isAuthorizedIngest).
[functions.instagram-publish-sweep]
verify_jwt = false

# ---------------------------------------------------------------------------
# Facebook Page Insights connector (read-only)
#
# All four require a JWT, and none is a Meta callback. That differs from the
# Instagram set, where two functions are anonymous because Meta calls them
# server-to-server with no session.
#
# facebook-deauthorize is the exception: Meta calls it with no session, so its
# signed_request HMAC is the entire authorization.
#
# It exists as its own function because Facebook Login carries its OWN
# Deauthorize Callback URL (Facebook Login -> Settings), separate from the one
# under Instagram Business login settings. An earlier draft of this comment
# assumed the callbacks were per-app and shared, which would have left every
# Facebook row stranded on a user-side removal — the existing
# instagram-deauthorize matches on ig_user_id and would find nothing.
# ---------------------------------------------------------------------------
[functions.facebook-oauth-start]
verify_jwt = true

# Called by the app's /facebook/callback PAGE, not by Meta. That is what makes a
# JWT available, and requiring it is what closes OAuth account-linking CSRF: an
# HMAC signature proves the state is ours, not that the browser finishing consent
# is the one that started it. verifyState requires the state to name this caller.
[functions.facebook-oauth-callback]
verify_jwt = true

[functions.facebook-insights]
verify_jwt = true

[functions.facebook-disconnect]
verify_jwt = true

# Anonymous by necessity: Meta POSTs with no session and no bearer we issued, so
# the signed_request signature is the whole gate. Declared here rather than left
# to a --no-verify-jwt deploy flag, because a comment asking the next person to
# remember one is a hope, and the gateway would otherwise reject Meta before this
# function ever ran. A missing FACEBOOK_APP_SECRET fails closed (503).
[functions.facebook-deauthorize]
verify_jwt = false

# Same posture and same reason as facebook-deauthorize: Meta POSTs with no
# session, so the signed_request signature is the entire gate. Its own function
# rather than a shared one because instagram-data-deletion matches rows on
# ig_user_id, which appears in no Facebook row — pointing Meta here at that
# function would delete nothing and return a confirmation code saying otherwise.
[functions.facebook-data-deletion]
verify_jwt = false

# ---------------------------------------------------------------------------
# X (Twitter) analytics connector — read-only.
#
# All four require a JWT. Unlike the Meta connectors there is no unauthenticated
# callback here: X has no deauthorize or data-deletion webhook, so every X
# function is called by our own app with the user's session.
#
# Declared here rather than left to `--no-verify-jwt` at deploy time, which was
# a Codex P1 on the Instagram connector: a comment asking the deployer to
# remember a flag is not a setting, and `supabase functions deploy` reads this
# file from the CURRENT directory — deploying from the wrong checkout silently
# applies the default.
# ---------------------------------------------------------------------------
[functions.x-oauth-start]
verify_jwt = true

# The browser lands on /x/callback INSIDE the app, which forwards the code with
# the user's own JWT. That is what proves the browser completing consent is the
# one that started the flow — an HMAC-signed state alone proves only that the
# state is ours. See the header of x-oauth-callback.
[functions.x-oauth-callback]
verify_jwt = true

[functions.x-insights]
verify_jwt = true

[functions.x-disconnect]
verify_jwt = true

# TikTok read-only analytics connector. All four are called BY THE APP with the
# user's own JWT, so all four verify it at the gateway.
#
# Note there are no anonymous entries in this family, unlike the Meta connectors:
# TikTok has no deauthorize or data-deletion webhook to receive, so nothing here
# is ever called by TikTok itself. The callback is a page inside the app that
# forwards the code with the caller's JWT — which is exactly what lets
# verifyState require the state to name that caller.
#
# Declared rather than left to the CLI default. An earlier connector relied on a
# code comment asking the deployer to remember a flag, which is not a control.
[functions.tiktok-oauth-start]
verify_jwt = true

[functions.tiktok-oauth-callback]
verify_jwt = true

[functions.tiktok-insights]
verify_jwt = true

[functions.tiktok-disconnect]
verify_jwt = true
