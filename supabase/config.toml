# Creator-storefront package-order money rail. The hero buyer is a restaurant with NO
# DragonCandy account, reached via a shareable link, so there is no Supabase JWT to verify.
# Each function resolves the caller itself: service-role key (cron), a user JWT (getUser),
# or an opaque guest bearer token (package_orders.buyer_guest_token). verify_jwt must be off
# or the gateway would reject the unauthenticated guest — same posture as the campaign escrow
# functions. refund-package-order deliberately differs from refund-campaign-escrow (which is
# verify_jwt=true) because package refunds must be guest-reachable.
# F1 Donny package draft — creator-facing, resolves the creator via their user JWT itself; verify_jwt off
# to match the rest of the Donny/AI fleet (each self-resolves auth).
[functions.suggest-package]
verify_jwt = false

