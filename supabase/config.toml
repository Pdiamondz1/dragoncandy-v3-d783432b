# Cron/automation caller: the post-merge RAG sync invokes this with a bearer key
# (injected service-role key OR AIOS_INGEST_SECRET), not a user JWT, so the gateway
# check must be off — the function self-gates via isAuthorizedIngest, and does so
# BEFORE it constructs its service-role client. It runs verify_jwt=false on prod but
# was UNDECLARED here, so a `supabase functions deploy` would have silently flipped
# it to the platform default (true) and broken the sync. Same posture as
# aios-report-ingest.
#
# NOT declared here: verify-recaptcha — it no longer exists. Its source was deleted
# from this repo by 7d8ef4a4 ("remove CAPTCHA from login and signup pages"), but the
# prod deployment was left running for months afterwards (v161, zero callers, no
# in-body authorization). Deleted from prod 2026-08-09; the endpoint now 404s, which
# completes docs/superpowers/plans/2026-04-30-remove-captcha-from-auth.md.
#
# The lesson worth keeping: "deleted from the repo" is not "deleted from prod" —
# the same merged-is-not-deployed gap that this file's donny-knowledge-sync entry
# guards against, pointing the other way.
[functions.donny-knowledge-sync]
verify_jwt = false

# Provider-agnostic social gateway (Outstand + Zernio adapters). verify_jwt stays
# TRUE — unlike the bespoke-auth functions above, the platform's standard Supabase
# JWT check is exactly what's wanted here, layered UNDER the function's own tenant
# scoping (resolveTenant -> auth.getUser() -> loadOwnedAccounts WHERE user_id).
# Stated explicitly rather than relying on the platform default, so this reads as a
# decision rather than an oversight. Mirrors live outstand-proxy (also verify_jwt=true).
[functions.social-proxy]
verify_jwt = true

# Phone verification (Twilio Verify). Bespoke-auth, like create-restaurant-connect-
# account above: verify_jwt=false, and the function does its own auth.getUser(token)
# check against the caller's own JWT. The anon key is itself a valid JWT and ships in
# the frontend bundle, so verify_jwt=true alone would not be authorization here.
[functions.verify-phone]
verify_jwt = false

# Same reasoning as verify-phone above: does its own auth.getUser(token) check.
[functions.verify-address]
verify_jwt = false

# Called by the app's /youtube/callback PAGE, not by Google — which is exactly
# why it requires a JWT. Google's redirect lands on a page inside DragonCandy,
# and that page forwards the code here with the user's own session; verifyState
# then requires the signed state to name that same user. Without an
# authenticated caller the flow is open to OAuth account-linking CSRF (start a
# connect, send the authorize URL to a victim, receive their tokens under your
# own account), which a signed state alone does not close.
[functions.youtube-oauth-callback]
verify_jwt = true

# Stated explicitly rather than inherited, so it reads as a decision: this one
# IS called by fetch from the app and must have an authenticated caller — the
# user_id it signs into the state comes from that JWT and from nothing else.
[functions.youtube-oauth-start]
verify_jwt = true

# Called by fetch from the app; the row it deletes is scoped by the caller's own
# user id, so an authenticated caller is required. Stated explicitly for the
# same reason as youtube-oauth-start.
[functions.youtube-disconnect]
verify_jwt = true

# Read-only analytics for the signed-in user; the connection it reads is scoped
# by the caller's own user id, so an authenticated caller is required.
[functions.youtube-analytics]
verify_jwt = true
