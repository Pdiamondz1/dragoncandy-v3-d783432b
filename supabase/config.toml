# Provider-agnostic social gateway (Outstand + Zernio adapters). verify_jwt stays
# TRUE — unlike the bespoke-auth functions above, the platform's standard Supabase
# JWT check is exactly what's wanted here, layered UNDER the function's own tenant
# scoping (resolveTenant -> auth.getUser() -> loadOwnedAccounts WHERE user_id).
# Stated explicitly rather than relying on the platform default, so this reads as a
# decision rather than an oversight. Mirrors live outstand-proxy (also verify_jwt=true).
[functions.social-proxy]
verify_jwt = true
