name: Migration Drift Audit

# Nightly check that every repo migration's schema objects actually exist in
# production. This is the guard that catches "committed but never applied"
# (the 2026-05 campaign_skips incident) — automatically, without anyone running
# the audit by hand. Opens a GitHub issue when drift is found.
#
# SETUP (one-time): add repo secret SUPABASE_ACCESS_TOKEN
#   (Supabase Dashboard -> Account -> Access Tokens). No DB password needed —
#   the CLI provisions a temporary read role from the access token. If your
#   project requires a DB password for `migration list`, also add
#   SUPABASE_DB_PASSWORD (the CLI reads it from the env automatically).

on:
  schedule:
    - cron: '17 7 * * *' # ~07:17 UTC nightly (off the :00 mark)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref zocahiffooqdybdhguqv
      - name: Detect drift
        id: drift
        run: npm run migrations:drift
      - name: Open issue on drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          gh issue create \
            --title "Migration drift: ${{ steps.drift.outputs.count }} migration(s) not applied to production" \
            --label "migration-drift" \
            --body "The nightly audit found repo migrations whose objects are missing from production (committed but never applied). See the workflow run summary for the list:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Remediation: apply the missing migration(s) to production, then verify with \`npm run migrations:drift\`."
